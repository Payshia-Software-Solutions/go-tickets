server {
    listen 80;
    server_name _;

    client_max_body_size 64M;

    # Static uploads served directly by Nginx
    location /uploads/ {
        alias /var/www/server/uploads/;
        expires 30d;
        access_log off;
    }

    # PHP API routes (/server and /server/...)
    location ^~ /server {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/server/index.php;
        fastcgi_param SCRIPT_NAME /server/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/server;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Next.js Frontend (all other routes & pages)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
